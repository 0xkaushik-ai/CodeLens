name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -p ./
      - run: npx vsce package --out codelens.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codelens-vsix
          path: codelens.vsix

  # Push a tag like v0.4.0 to publish the .vsix on the GitHub Releases page,
  # so people can install the extension without building it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codelens-vsix
      - run: mv codelens.vsix "codelens-${GITHUB_REF_NAME#v}.vsix"
      - uses: softprops/action-gh-release@v2
        with:
          files: codelens-*.vsix
          generate_release_notes: true
