services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # local only: the API reads your source code
    environment:
      - CODELENS_DB_PATH=/data
      - OLLAMA_HOST=http://ollama:11434
      - EMBED_MODEL=nomic-embed-text
    volumes:
      - codelens_data:/data
      # Repos are indexed by absolute path, so mount your home at the same path (read-only)
      - ${HOME}:${HOME}:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "ollama serve & sleep 3 && ollama pull nomic-embed-text && wait"

volumes:
  codelens_data:
  ollama_data:
